# academy.analytics-mamasloft.ru — employee training platform
# This block is appended to the server-owned analytics.active.conf after the
# certificate has been issued. The app has its own PIN authentication.
server {
    listen 80;
    server_name academy.analytics-mamasloft.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name academy.analytics-mamasloft.ru;

    ssl_certificate /etc/letsencrypt/live/academy.analytics-mamasloft.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.analytics-mamasloft.ru/privkey.pem;

    root /var/www/dashboards/academy;
    index index.html;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location = /content.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
