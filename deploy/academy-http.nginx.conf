# Temporary HTTP-only vhost used to issue the first Let's Encrypt certificate.
server {
    listen 80;
    server_name academy.analytics-mamasloft.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        return 503 "academy.analytics-mamasloft.ru is being provisioned\n";
    }
}
